<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123a56"/><stop offset="1" stop-color="#071b30"/>
    </linearGradient>
    <linearGradient id="cliff" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#40525a"/><stop offset="1" stop-color="#172630"/>
    </linearGradient>
    <pattern id="waves" width="90" height="42" patternUnits="userSpaceOnUse">
      <path d="M0 20 Q22 6 45 20 T90 20" fill="none" stroke="#3b8093" stroke-opacity=".24" stroke-width="3"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M0 0 L14 7 L0 14 Z" fill="#ffd45a"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#sea)"/>
  <rect width="1600" height="900" fill="url(#waves)"/>

