        fill="none" stroke="#0b1117" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M260 640 C180 598 160 492 229 426 C284 374 382 384 432 333 C468 296 439 236 496 201 C560 161 655 204 718 247 C772 284 806 282 854 247 C923 197 965 164 1058 183 C1150 202 1202 267 1174 333 C1151 388 1081 400 1030 435 C975 473 989 541 1055 569 C1110 593 1200 575 1273 613 C1354 655 1368 735 1304 770 C1224 814 1118 756 1034 715 C957 677 888 700 827 747 C752 805 646 793 583 739 C530 694 491 645 423 659 C369 670 317 674 260 640 Z"
        fill="none" stroke="#6f7a7d" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
