  <path d="M70 220 L205 130 L430 98 L625 150 L786 92 L1014 118 L1200 72 L1470 170 L1535 370 L1470 575 L1550 730 L1370 820 L1105 766 L955 842 L700 784 L505 845 L270 766 L115 650 L168 468 Z" fill="url(#cliff)" stroke="#657b81" stroke-width="8" filter="url(#shadow)"/>
