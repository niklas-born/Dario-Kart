        fill="none" stroke="#d6d4c4" stroke-width="4" stroke-dasharray="18 16" stroke-linecap="round"/>

  <!-- red/white curb blocks placed along key corners -->
  <g fill="#e34e45" stroke="#f2e8d2" stroke-width="10">
    <path d="M174 518 L216 520 L213 561 L178 558 Z"/><path d="M365 374 L397 358 L417 392 L385 407 Z"/>
    <path d="M455 230 L488 210 L511 241 L479 260 Z"/><path d="M1110 193 L1138 217 L1117 249 L1087 225 Z"/>
    <path d="M1154 346 L1191 354 L1177 393 L1141 383 Z"/><path d="M1283 635 L1309 613 L1340 640 L1315 669 Z"/>
    <path d="M1154 757 L1174 720 L1209 737 L1186 774 Z"/><path d="M634 768 L651 731 L688 742 L676 781 Z"/>
  </g>

  <!-- harbor sweep -->
  <g fill="#a9c4cb" stroke="#172832" stroke-width="5">
    <path d="M82 570 L205 570 L236 604 L118 604 Z"/><path d="M58 625 L187 625 L218 658 L94 658 Z"/>
    <path d="M99 548 L118 511 L137 548 Z"/><path d="M146 548 L165 511 L184 548 Z"/>
  </g>
  <g stroke="#e07443" stroke-width="12"><path d="M120 570 V478"/><path d="M178 570 V458"/><path d="M120 478 L189 505"/><path d="M178 458 L245 496"/></g>

  <!-- turbine hall -->
  <g filter="url(#shadow)">
    <rect x="860" y="115" width="190" height="132" rx="12" fill="#d67441" stroke="#f2b15c" stroke-width="6"/>
    <rect x="880" y="132" width="150" height="95" fill="#1b3540" stroke="#7bb7b9" stroke-width="5"/>
    <circle cx="955" cy="180" r="43" fill="#223e49" stroke="#e99c43" stroke-width="9"/>
    <circle cx="955" cy="180" r="11" fill="#d8e5d6"/>
    <g stroke="#e99c43" stroke-width="6"><path d="M955 137 L955 223"/><path d="M912 180 L998 180"/><path d="M925 150 L985 210"/><path d="M985 150 L925 210"/></g>
  </g>

  <!-- spillway jump -->
  <path d="M1070 514 L1215 514 L1280 610 L1150 585 Z" fill="#5ca6ae" stroke="#d9edf0" stroke-width="8" opacity=".9"/>
  <path d="M1110 570 C1150 606 1185 614 1228 640" fill="none" stroke="#d8f3f4" stroke-width="18" opacity=".8"/>
  <path d="M1160 566 L1216 566" stroke="#ffae48" stroke-width="9" stroke-dasharray="16 12" marker-end="url(#arrow)"/>

  <!-- optional shortcut: elevated dotted path reconnecting before spillway -->
  <path d="M921 566 C860 518 825 450 860 391 C888 343 955 326 1011 353" fill="none" stroke="#101a20" stroke-width="32" stroke-dasharray="15 14" opacity=".95"/>
  <path d="M921 566 C860 518 825 450 860 391 C888 343 955 326 1011 353" fill="none" stroke="#ffca52" stroke-width="4" stroke-dasharray="8 10"/>

  <!-- directional chevrons -->
  <g fill="#ffca52">
    <path d="M210 455 l30 -22 v17 l26 -19 v20 l-26 19 v17z"/><path d="M390 350 l28 -22 v17 l25 -19 v20 l-25 19 v17z"/>
    <path d="M1132 304 l28 -22 v17 l25 -19 v20 l-25 19 v17z"/><path d="M1241 594 l28 -22 v17 l25 -19 v20 l-25 19 v17z"/>
  </g>

  <!-- start / finish gantry -->
  <g filter="url(#shadow)">
    <path d="M270 598 V530 M382 641 V572" stroke="#e9ece2" stroke-width="12"/>
    <path d="M266 530 L386 572" stroke="#e9ece2" stroke-width="14"/>
    <path d="M267 530 L386 572" stroke="#d84d43" stroke-width="7" stroke-dasharray="16 12"/>
    <path d="M232 608 L419 670" stroke="#f5f0dc" stroke-width="6" stroke-dasharray="12 10"/>
