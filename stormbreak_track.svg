  <!-- sector beacons -->
  <g fill="#ffd45a" stroke="#15212b" stroke-width="5">
    <circle cx="216" cy="423" r="16"/><circle cx="486" cy="198" r="16"/><circle cx="1055" cy="180" r="16"/><circle cx="1275" cy="610" r="16"/>
  </g>
  <g font-family="Arial, sans-serif" font-weight="700" fill="#eff6ec">
    <text x="105" y="390" font-size="26">01  HARBOR SWEEP</text>
    <text x="470" y="151" font-size="26">02  CLIFF ASCENT</text>
    <text x="860" y="84" font-size="26">03  TURBINE HALL</text>
    <text x="1200" y="570" font-size="26">04  SPILLWAY FLIGHT</text>
    <text x="70" y="842" font-size="22" fill="#9fc7cf">STORMBREAK CIRCUIT  •  TOP-DOWN PLAYABLE BLOCKOUT</text>
    <text x="1010" y="843" font-size="18" fill="#c5d8d3">LOOP / SHORTCUT / JUMP / RUNOFF</text>
  </g>

  <!-- route arrow sequence -->
  <g fill="none" stroke="#ffd45a" stroke-width="6" marker-end="url(#arrow)" opacity=".95">
    <path d="M270 630 Q215 600 207 540"/><path d="M285 408 Q370 392 425 343"/>
    <path d="M531 204 Q627 204 705 257"/><path d="M1087 198 Q1160 221 1171 300"/>
    <path d="M1071 584 Q1145 590 1210 617"/><path d="M1246 752 Q1166 749 1084 711"/>
  </g>

  <!-- compact legend -->
  <g transform="translate(60 70)" font-family="Arial, sans-serif">
    <rect width="270" height="118" rx="14" fill="#08131c" fill-opacity=".85" stroke="#86b5b8" stroke-width="2"/>
    <text x="18" y="30" fill="#f4f0dc" font-size="18" font-weight="700">TRACK NOTES</text>
    <path d="M20 53 H62" stroke="#d6d4c4" stroke-width="10"/><text x="78" y="59" fill="#dae7df" font-size="15">drivable surface</text>
    <path d="M20 78 H62" stroke="#ffca52" stroke-width="4" stroke-dasharray="8 8"/><text x="78" y="84" fill="#dae7df" font-size="15">optional shortcut</text>
    <path d="M20 103 H62" stroke="#5ca6ae" stroke-width="10"/><text x="78" y="109" fill="#dae7df" font-size="15">water / jump zone</text>
  </g>
</svg>
